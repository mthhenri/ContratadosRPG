@if (servico.fila().length > 0) {
    <div class="notificacoes" role="status" aria-live="polite">
        @for (entrada of servico.fila(); track entrada.id) {
            <article
                class="notificacoes__item"
                [class.notificacoes__item--sucesso]="entrada.severidade === 'sucesso'"
                [class.notificacoes__item--informacao]="entrada.severidade === 'informacao'"
                [class.notificacoes__item--aviso]="entrada.severidade === 'aviso'"
                [class.notificacoes__item--erro]="entrada.severidade === 'erro'"
                [class.notificacoes__item--saindo]="entrada.saindo"
                (mouseenter)="servico.pausar(entrada.id)"
                (mouseleave)="servico.retomar(entrada.id)"
            >
                <span class="notificacoes__icone">
                    <app-icone [nome]="icone(entrada.severidade)" />
                </span>

                <div class="notificacoes__texto">
                    <span class="notificacoes__resumo">{{ entrada.resumo }}</span>
                    @if (entrada.detalhe) {
                        <span class="notificacoes__detalhe">{{ entrada.detalhe }}</span>
                    }
                    @if (entrada.acao; as acao) {
                        <button
                            app-botao
                            [variante]="variante(entrada.severidade)"
                            estilo="link"
                            type="button"
                            class="notificacoes__acao"
                            (click)="executarAcao(entrada)"
                        >
                            {{ acao.rotulo }}
                        </button>
                    }
                </div>

                <button
                    app-botao-icone
                    class="notificacoes__fechar"
                    type="button"
                    aria-label="Fechar notificação"
                    [appTooltip]="'Fechar'"
                    (click)="servico.fechar(entrada.id)"
                >
                    ×
                </button>

                <span
                    class="notificacoes__barra"
                    aria-hidden="true"
                    [style.animation-duration.ms]="entrada.duracaoMs"
                ></span>
            </article>
        }
    </div>
}
