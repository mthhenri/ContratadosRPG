@if (ativo() && !conectado()) {
    <app-chip
        class="indicador-tempo-real"
        severidade="aviso"
        role="status"
        aria-live="polite"
        aria-label="Tempo real offline"
    >
        <span class="indicador-tempo-real__ponto" aria-hidden="true"></span>
        <span class="indicador-tempo-real__texto" aria-hidden="true">Tempo real offline</span>
    </app-chip>
}
