<button
    type="button"
    class="inventario-sidebar__gatilho utilitario-flutuante utilitario-flutuante--inline-mobile"
    [class.inventario-sidebar__gatilho--ativo]="aberto()"
    [attr.aria-expanded]="aberto()"
    aria-label="Abrir inventário de esquadrão"
    [appTooltip]="'Inventário de esquadrão'"
    (click)="alternar()"
>
    <app-icone nome="inventario" />
</button>

@if (painelRenderizado()) {
    <button
        class="inventario-sidebar__fundo"
        [class.inventario-sidebar__fundo--saindo]="saindo()"
        type="button"
        aria-label="Fechar inventário"
        (click)="fechar()"
    ></button>
    <aside
        class="inventario-sidebar__painel"
        [class.inventario-sidebar__painel--saindo]="saindo()"
        role="complementary"
        aria-label="Inventário de esquadrão"
        tabindex="-1"
        appAutoFocus
        (keydown.escape)="fechar()"
    >
        <header class="inventario-sidebar__cabecalho">
            <app-icone nome="inventario" />
            <h2 class="inventario-sidebar__titulo">Inventário de Esquadrão</h2>
            <span class="inventario-sidebar__regua"></span>
            <button
                app-botao-icone
                class="inventario-sidebar__fechar"
                type="button"
                aria-label="Fechar inventário"
                [appTooltip]="'Fechar'"
                (click)="fechar()"
            >
                ×
            </button>
        </header>
        <div class="inventario-sidebar__corpo">
            <app-inventario-esquadrao
                [campanhaId]="campanhaId()"
                [itens]="itens()"
                [fichas]="fichas()"
                (alterado)="alterado.emit($event)"
            />
        </div>
    </aside>
}
