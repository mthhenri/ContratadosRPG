@if (bandeja.entradas().length > 0) {
    <div
        class="bandeja"
        role="status"
        aria-live="polite"
        [style.--bandeja-carta-largura.px]="larguraCarta()"
        [style.--bandeja-duracao.ms]="bandeja.duracaoMs"
    >
        <div class="bandeja__ancora">
            <div
                class="bandeja__pilha"
                [style.transform]="'translateX(-50%) translateX(' + deslocamento() + 'px)'"
            >
                @for (entrada of bandeja.entradas(); track entrada.id) {
                    <article
                        class="bandeja__carta"
                        [class.bandeja__carta--saindo]="entrada.saindo"
                        [style.opacity]="entrada.saindo ? 0 : opacidade($index)"
                        (mouseenter)="bandeja.pausar(entrada.id)"
                        (mouseleave)="bandeja.retomar(entrada.id)"
                    >
                        <header class="bandeja__cabecalho">
                            <span class="bandeja__rotulo">{{ entrada.rotulo }}</span>
                            <app-chip
                                class="bandeja__visibilidade"
                                [severidade]="
                                    entrada.visibilidade === RolagemVisibilidadeEnum.PRIVADA
                                        ? 'perigo'
                                        : 'secundario'
                                "
                                [attr.data-icone]="
                                    entrada.visibilidade === RolagemVisibilidadeEnum.PRIVADA
                                        ? 'olho-fechado'
                                        : 'olho'
                                "
                            >
                                <app-icone
                                    [nome]="
                                        entrada.visibilidade === RolagemVisibilidadeEnum.PRIVADA
                                            ? 'olho-fechado'
                                            : 'olho'
                                    "
                                />
                                {{
                                    entrada.visibilidade === RolagemVisibilidadeEnum.PRIVADA
                                        ? "Privada"
                                        : "Pública"
                                }}
                            </app-chip>
                            <button
                                class="bandeja__fechar"
                                type="button"
                                aria-label="Fechar rolagem"
                                (click)="bandeja.fechar(entrada.id)"
                            >
                                ×
                            </button>
                        </header>

                        @if (entrada.formula) {
                            <code class="bandeja__formula">{{ entrada.formula }}</code>
                        }

                        <app-resultado-rolagem
                            [resultado]="entrada.resultado"
                            [corFicha]="entrada.corFicha"
                        />

                        @if (!entrada.semAutoSumir) {
                            <span class="bandeja__barra" aria-hidden="true"></span>
                        }
                    </article>
                }
            </div>
        </div>
    </div>
}
