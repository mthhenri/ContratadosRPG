<!-- m3-56: largura fixa (400px, --p-toast-width) estourava viewports de 360-390px (medido ao
     vivo — `overflow-x: clip` do `html` escondia sem virar scroll do body, mas o toast ficava
     parcialmente fora e inclicável). O input `[breakpoints]` do PrimeNG (mesma API do
     `p-dialog`) gera a media query mas mira um atributo `pn_id` que não chega a existir no
     elemento renderizado nesta versão (21.2.13) — sem efeito. Fix real em `styles.scss`
     (`.p-toast`, `@include bp.mobile`). -->
<p-toast position="bottom-center" />

@if (loadingService.isLoading()) {
  <span class="carregando-global" role="status" aria-label="Carregando"></span>
}

<header class="topbar">
  <app-marca class="topbar__logo" />
  <span class="topbar__marca">Contratados<span class="topbar__marca-sufixo">RPG</span></span>

  <nav class="topbar__nav" aria-label="Navegação principal">
    @if (sessaoService.autenticado()) {
      <a class="topbar__item" routerLink="/painel" routerLinkActive="topbar__item--ativo">
        <app-icone nome="campanhas" />
        <span>Painel</span>
      </a>
      <a class="topbar__item" routerLink="/fichas" routerLinkActive="topbar__item--ativo">
        <app-icone nome="agente" />
        <span>Fichas</span>
      </a>
    }
    <a class="topbar__item" routerLink="/calculadora" routerLinkActive="topbar__item--ativo">
      <app-icone nome="calculadora" />
      <span>Calculadora</span>
    </a>
    <button
      class="topbar__item"
      type="button"
      aria-label="Abrir documentos"
      (click)="abrirDocumentos()"
    >
      <app-icone nome="documentos" />
      <span>Documentos</span>
    </button>
  </nav>

  <div class="topbar__acoes">
    @if (sessaoService.usuario(); as usuarioAtual) {
      <div class="topbar__perfil">
        <button
          class="topbar__perfil-gatilho"
          type="button"
          [attr.aria-expanded]="perfilAberto()"
          (click)="alternarPerfil()"
        >
          <span class="topbar__identidade">{{ usuarioAtual.nome }}</span>
          <span class="topbar__avatar" aria-hidden="true"></span>
          <app-icone nome="chevron" />
        </button>

        @if (perfilAberto()) {
          <div class="topbar__perfil-menu" role="menu">
            <!-- No mobile o nome sai da barra (`topbar__identidade` some) — o menu o reapresenta
                 como cabeçalho, dizendo de quem é a sessão antes das ações. -->
            <span class="topbar__perfil-usuario" role="presentation">{{ usuarioAtual.nome }}</span>
            <a
              class="topbar__perfil-item"
              routerLink="/perfil"
              role="menuitem"
              (click)="fecharPerfil()"
            >
              <app-icone nome="agente" />
              <span>Perfil</span>
            </a>
            <a
              class="topbar__perfil-item"
              routerLink="/painel"
              role="menuitem"
              (click)="fecharPerfil()"
            >
              <app-icone nome="campanhas" />
              <span>Campanhas</span>
            </a>
            <!-- No mobile o Tema mora aqui dentro (libera a largura da topbar); no desktop ele fica
                 na barra, ao lado do perfil. -->
            <app-configuracoes-tema class="topbar__perfil-tema" variante="menu" role="none" />
            <button
              class="topbar__perfil-item topbar__perfil-item--sair"
              type="button"
              role="menuitem"
              (click)="sair()"
            >
              <app-icone nome="sair" />
              <span>Encerrar sessão</span>
            </button>
          </div>
        }
      </div>
    } @else {
      <a class="topbar__sessao" routerLink="/login">
        <app-icone nome="entrar" />
        <span>Entrar</span>
      </a>
    }

    <!-- Autenticado no mobile: o gatilho da barra sai (o Tema está no menu de perfil). Deslogado
         não há menu, então ele permanece na barra em qualquer largura. -->
    <app-configuracoes-tema
      class="topbar__tema"
      [class.topbar__tema--so-desktop]="sessaoService.autenticado()"
    />
  </div>
</header>

<main class="conteudo">
  <router-outlet />
</main>

<ng-container #leitorDocumentosContainer />
