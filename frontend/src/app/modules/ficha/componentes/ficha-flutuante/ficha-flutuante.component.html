@if (aberto() && painelRef()?.minimizado()) {
    <button
        #gatilho
        class="ficha-flutuante__gatilho"
        type="button"
        aria-label="Reabrir ficha"
        aria-expanded="false"
        (click)="painelRef()?.restaurar()"
    >
        <app-icone nome="visao-geral" />
    </button>
}

<app-painel-flutuante
    #painel="appPainelFlutuante"
    id="ficha-flutuante"
    titulo="Ficha do combatente"
    [aberto]="aberto()"
    [mobile]="ehMobile()"
    [maximizada]="maximizada()"
    [largura]="ehMobile() ? null : geometria().largura"
    [altura]="ehMobile() ? null : geometria().altura"
    (fechar)="fechar()"
    (minimizadoChange)="aoMinimizadoChange($event)"
>
    @if (!ehMobile()) {
        <button
            painelAcoesExtras
            app-botao-icone
            class="ficha-flutuante__acao-janela"
            type="button"
            [attr.aria-label]="maximizada() ? 'Restaurar tamanho da ficha' : 'Maximizar ficha'"
            [appTooltip]="maximizada() ? 'Restaurar tamanho' : 'Maximizar'"
            (pointerdown)="$event.stopPropagation()"
            (click)="alternarMaximizacao()"
        >
            <span aria-hidden="true">{{ maximizada() ? "❐" : "□" }}</span>
        </button>
    }

    <div class="ficha-flutuante__corpo">
        @if (alvo(); as alvoAtual) {
            <app-ficha-flutuante-conteudo [alvo]="alvoAtual" [ehMestre]="ehMestre()" />
        }
    </div>

    @if (!ehMobile() && !maximizada()) {
        <span
            painelRedimensionar
            class="ficha-flutuante__redimensionar"
            aria-hidden="true"
            (pointerdown)="iniciarRedimensionamento($event)"
        ></span>
    }
</app-painel-flutuante>
