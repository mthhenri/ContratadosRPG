<div class="enquadramento" role="dialog" aria-label="Ajustar enquadramento da imagem">
    <header class="enquadramento__cabecalho">
        <span class="enquadramento__titulo">Ajustar enquadramento</span>
    </header>

    <div
        #caixa
        class="enquadramento__caixa"
        [style.width.px]="larguraPreVisualizacao()"
        [style.height.px]="alturaPreVisualizacao"
        (pointerdown)="aoIniciarArrasto($event)"
        (pointermove)="aoMoverArrasto($event, caixa)"
        (pointerup)="aoSoltarArrasto($event)"
        (pointercancel)="aoSoltarArrasto($event)"
    >
        <img
            #focoImg="appFocoImagem"
            class="enquadramento__imagem"
            [src]="previewUrl()"
            alt=""
            draggable="false"
            [appFocoImagem]="{ x: x(), y: y(), escala: escala() }"
            [appFocoImagemCaixa]="proporcao()"
        />
    </div>

    <label class="enquadramento__zoom">
        <span class="enquadramento__zoom-rotulo">Zoom</span>
        <input
            type="range"
            class="enquadramento__zoom-entrada"
            [min]="escalaMinima"
            [max]="escalaMaxima"
            step="0.05"
            [value]="escala()"
            aria-label="Zoom"
            (input)="aoAjustarEscala($event)"
        />
    </label>

    <div class="enquadramento__acoes">
        <button
            app-botao
            tamanho="medio"
            variante="secundario"
            type="button"
            (click)="cancelar.emit()"
        >
            Cancelar
        </button>
        <button
            app-botao
            tamanho="medio"
            variante="primario"
            type="button"
            (click)="confirmarEnquadramento()"
        >
            Confirmar
        </button>
    </div>
</div>
