<div class="guia__etapa">
    <div class="guia__introducao">
        <span class="guia__introducao-codigo">IDENTIDADE // PESSOA</span>
        <p>Quem é esta pessoa e qual papel ela ocupa na história?</p>
    </div>
    <app-campo rotulo="Nome" tamanho="compacto">
        <input
            class="campo__controle"
            [formControl]="controles.nome"
            autocomplete="off"
            placeholder="Ex.: Dra. Helena Mota"
        />
    </app-campo>
    <app-campo rotulo="Função narrativa" tamanho="compacto">
        <textarea
            class="campo__controle"
            [formControl]="controles.funcao"
            rows="2"
            placeholder="Ex.: médica da Fundação e contato do esquadrão"
        ></textarea>
    </app-campo>
    <div class="guia__campos guia__campos--duas-colunas">
        <app-campo
            rotulo="Categoria"
            tamanho="compacto"
            [dica]="criacao.referenciaCategoria().perfil"
        >
            <select class="campo__controle" [formControl]="controles.categoria">
                @for (categoria of categorias; track categoria.categoria) {
                    <option [value]="categoria.categoria">{{ categoria.rotulo }}</option>
                }
            </select>
        </app-campo>
        <app-campo
            rotulo="Nível"
            tamanho="compacto"
            [dica]="
                'Faixa sugerida: ' +
                criacao.referenciaCategoria().nivelSugerido +
                '. Livre de 0 a 20.'
            "
        >
            <app-step-input
                [formControl]="controles.nivel"
                [min]="0"
                [max]="20"
                tamanho="padrao"
                ariaRotulo="Nível"
            />
        </app-campo>
    </div>
    <app-campo
        rotulo="Cooperação"
        tamanho="compacto"
        dica="Postura diante do grupo, independente da Categoria."
    >
        <app-step-input
            [formControl]="controles.cooperacao"
            [min]="0"
            [max]="10"
            tamanho="padrao"
            ariaRotulo="Cooperação"
        />
    </app-campo>
    @if (criacao.referenciaCooperacao(); as referencia) {
        <div class="guia__referencia" aria-live="polite">
            <h3>{{ referencia.rotulo }}</h3>
            <p><strong>Social</strong> {{ referencia.social }}</p>
            <p><strong>Combate</strong> {{ referencia.combate }}</p>
        </div>
    }
</div>
