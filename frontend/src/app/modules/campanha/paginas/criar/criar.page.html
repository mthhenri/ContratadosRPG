<div class="dialogo" role="dialog" aria-modal="true" aria-label="Nova campanha">
    <button
        class="dialogo__fundo"
        type="button"
        aria-label="Fechar"
        (click)="fecharDialog()"
    ></button>
    <div class="dialogo__painel">
        <header class="dialogo__cabecalho">
            <span class="dialogo__indice">//</span>
            <h2 class="dialogo__titulo">Nova campanha</h2>
            <span class="dialogo__regua"></span>
            <button
                class="dialogo__fechar"
                type="button"
                aria-label="Fechar"
                (click)="fecharDialog()"
            >
                ✕
            </button>
        </header>

        <form class="campanha-formulario__corpo" [formGroup]="formulario" (ngSubmit)="enviar()">
            <label class="campanha-formulario__campo">
                <span class="campanha-formulario__rotulo">Nome</span>
                <input
                    class="campanha-formulario__entrada"
                    type="text"
                    formControlName="nome"
                    required
                />
            </label>

            <label class="campanha-formulario__campo">
                <span class="campanha-formulario__rotulo">Descrição (opcional)</span>
                <textarea
                    class="campanha-formulario__entrada campanha-formulario__entrada--area"
                    formControlName="descricao"
                    rows="3"
                ></textarea>
            </label>

            <button
                app-botao
                variante="primario"
                class="campanha-formulario__enviar"
                type="submit"
                [disabled]="enviando()"
            >
                {{ enviando() ? 'Criando…' : 'Criar campanha' }}
            </button>
        </form>
    </div>
</div>
