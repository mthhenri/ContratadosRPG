<div class="dialogo" role="dialog" aria-modal="true" aria-label="Entrar por código">
  <button class="dialogo__fundo" type="button" aria-label="Fechar" (click)="fecharDialog()"></button>
  <div class="dialogo__painel">
    <header class="dialogo__cabecalho">
      <span class="dialogo__indice">//</span>
      <h2 class="dialogo__titulo">Entrar por código</h2>
      <span class="dialogo__regua"></span>
      <button class="dialogo__fechar" type="button" aria-label="Fechar" (click)="fecharDialog()">✕</button>
    </header>

    <form class="campanha-formulario__corpo" [formGroup]="formulario" (ngSubmit)="enviar()">
      <label class="campanha-formulario__campo">
        <span class="campanha-formulario__rotulo">Código de convite</span>
        <input
          class="campanha-formulario__entrada"
          type="text"
          formControlName="codigoConvite"
          autocapitalize="characters"
          spellcheck="false"
        />
      </label>

      <button
        class="botao botao--primario campanha-formulario__enviar"
        type="submit"
        [disabled]="enviando()"
      >
        {{ enviando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
