@if (itens().length || filtro.value !== "TODOS") {
    <app-cartao titulo="Criaturas e NPCs" [cabecalhoQuebravel]="true">
        <span cartaoIndice>//</span>
        <div class="fichas-especiais__acoes">
            <app-campo rotulo="Exibir" tamanho="compacto">
                <select class="campo__controle" aria-label="Exibir" [formControl]="filtro">
                    <option value="TODOS">Todos</option>
                    <option [value]="TipoFichaEnum.CRIATURA">Criaturas</option>
                    <option [value]="TipoFichaEnum.NPC">NPCs</option>
                </select>
            </app-campo>
        </div>
        <ul class="fichas-especiais__grade">
            @for (entrada of itens(); track entrada.item.id) {
                <li>
                    <app-cartao-ficha-acervo
                        [item]="entrada.item"
                        [campanhaDestino]="campanhaId()"
                        [mostrarMenu]="false"
                    />
                </li>
            } @empty {
                <li class="fichas-especiais__vazio">
                    <app-estado-vazio
                        icone="agente"
                        titulo="Nenhuma ficha neste recorte"
                        linhaApoio="Criaturas e NPCs aparecem aqui conforme o acesso concedido."
                    />
                </li>
            }
        </ul>
    </app-cartao>
}
