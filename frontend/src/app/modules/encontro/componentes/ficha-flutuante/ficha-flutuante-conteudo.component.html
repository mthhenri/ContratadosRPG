@if (carregando()) {
  <p class="ficha-flutuante-conteudo__carregando">Carregando ficha…</p>
} @else if (alvo().tipo === TipoFichaEnum.JOGADOR && fichaJogador(); as ficha) {

    [fichaId]="ficha.id"
    [nome]="ficha.nome"
    [cor]="ficha.cor"
    [imagemUrl]="ficha.imagemUrl"
    [dados]="ficha.dados"
    [ajustavel]="ajustavel()"
    [podeRolar]="true"
    [ehMestre]="ehMestre()"

    modo="compacto"
    (ajusteVitalidade)="fichaEdicao.ajustarVitalidade($event)"

    (ajusteResistencia)="fichaEdicao.ajustarResistencia($event)"
    (ajusteAtributos)="fichaEdicao.ajustarAtributos($event)"
    (ajusteNome)="fichaEdicao.ajustarNome($event)"
    (ajusteCor)="fichaEdicao.ajustarCor($event)"
    (ajusteCampoDados)="fichaEdicao.ajustarCampoDados($event)"
    (ajusteClasse)="fichaEdicao.ajustarClasse($event)"
    (ajusteSanidade)="fichaEdicao.ajustarSanidade($event)"
    (ajusteCondicoes)="fichaEdicao.ajustarCondicoes($event)"
    (ajusteHabilidades)="fichaEdicao.ajustarHabilidades($event)"
    (ajusteInventario)="fichaEdicao.ajustarInventario($event)"
    (ajusteRolagens)="fichaEdicao.ajustarRolagens($event)"
    (ajusteCombos)="fichaEdicao.ajustarCombos($event)"
    (ajusteFragmentosConsumidos)="fichaEdicao.ajustarFragmentosConsumidos($event)"
    (ajusteAnotacoes)="fichaEdicao.ajustarAnotacoes($event)"
    (ajusteHistoria)="fichaEdicao.ajustarHistoria($event)"
    (ajustePersonalidade)="fichaEdicao.ajustarPersonalidade($event)"
    (ajusteOrigem)="fichaEdicao.ajustarOrigem($event)"
    (origemLimpa)="fichaEdicao.limparOrigem()"
    (ajusteContrato)="fichaEdicao.ajustarContrato($event)"
  />
} @else if (fichaCriatura(); as ficha) {
  <app-criatura-visualizacao
    [fichaId]="ficha.id"
    [nome]="ficha.nome"
    [cor]="ficha.cor"
    [imagemUrl]="ficha.imagemUrl"
    [foco]="ficha.imagemFoco"
    [oculta]="ficha.oculta"
    [dados]="ficha.dados"
    [ajustavel]="ajustavel()"
    (vitalidadeMudou)="fichaEdicaoCriatura.ajustarVitalidade($event)"
    (defesaMudou)="fichaEdicaoCriatura.ajustarDefesa($event)"
    (identidadeMudou)="fichaEdicaoCriatura.ajustarIdentidade($event)"
    (naMudou)="fichaEdicaoCriatura.ajustarNa($event)"
    (vdMudou)="fichaEdicaoCriatura.ajustarVd($event)"

    (modificadoresMudou)="fichaEdicaoCriatura.ajustarModificadores($event)"
    (tenacidadeMudou)="fichaEdicaoCriatura.ajustarTenacidade($event)"
    (resistenciasMudou)="fichaEdicaoCriatura.ajustarResistencias($event)"
    (fraquezasMudou)="fichaEdicaoCriatura.ajustarFraquezas($event)"
    (regeneracaoMudou)="fichaEdicaoCriatura.ajustarRegeneracao($event)"
    (porteMudou)="fichaEdicaoCriatura.ajustarPorte($event)"
    (deslocamentoMudou)="fichaEdicaoCriatura.ajustarDeslocamento($event)"

    (iniciativaBonusMudou)="fichaEdicaoCriatura.ajustarIniciativaBonus($event)"
    (ataquesMudou)="fichaEdicaoCriatura.ajustarAtaques($event)"
    (habilidadesMudou)="fichaEdicaoCriatura.ajustarHabilidades($event)"
    (anotacoesMudou)="fichaEdicaoCriatura.ajustarAnotacoes($event)"
    (nomeMudou)="fichaEdicaoCriatura.ajustarNome($event)"
    (corMudou)="fichaEdicaoCriatura.ajustarCor($event)"
    (ocultaMudou)="fichaEdicaoCriatura.ajustarOculta($event)"
    (imagemMudou)="fichaEdicaoCriatura.ajustarImagem($event)"
    (removerImagem)="fichaEdicaoCriatura.removerImagem()"
    (focoMudou)="fichaEdicaoCriatura.ajustarImagemFoco($event)"
  />
} @else {
  <p class="ficha-flutuante-conteudo__carregando">Ficha não encontrada.</p>
}
