<section
    #painel
    class="rolagem-avulso"
    role="dialog"
    [class.rolagem-avulso--posicionada]="posicao() !== null"
    [attr.aria-label]="'Rolagens de ' + combatente().nome"
    [style.--cor-avulso]="combatente().corFicha"
    [style.left.px]="posicao()?.x"
    [style.top.px]="posicao()?.y"
>
    <header class="rolagem-avulso__cabecalho" (pointerdown)="iniciarArraste($event)">
        <span class="rolagem-avulso__identidade">
            <app-icone nome="dado" />
            <span>
                <small>Rolando como</small>
                <strong>{{ combatente().nome }}</strong>
            </span>
        </span>
        <button
            app-botao-icone
            tamanho="compacto"
            class="rolagem-avulso__fechar"
            type="button"
            aria-label="Fechar rolagens"
            appTooltip="Fechar rolagens"
            (pointerdown)="$event.stopPropagation()"
            (click)="fechado.emit()"
        >
            <app-icone nome="fechar-painel" />
        </button>
    </header>

    <form class="rolagem-avulso__formulario" (submit)="$event.preventDefault(); rolar()">
        <button
            app-botao-icone
            class="rolagem-avulso__montador"
            tamanho="padrao"
            variante="secundario"
            type="button"
            aria-label="Montar fórmula por botões"
            appTooltip="Montar fórmula por botões"
            (click)="montador.abrir()"
        >
            <app-icone nome="dado-mais" />
        </button>
        <app-campo class="rolagem-avulso__campo" rotulo="Expressão" tamanho="padrao">
            <input
                class="campo__controle rolagem-avulso__expressao"
                type="text"
                autocomplete="off"
                placeholder="Ex.: 2d6+3"
                [value]="expressao()"
                (input)="alterarExpressao($any($event.target).value)"
            />
        </app-campo>

        <button
            app-botao
            variante="secundario"
            estilo="preenchido"
            tamanho="pequeno"
            posicaoIcone="esquerda"
            class="rolagem-avulso__visibilidade"
            type="button"
            [attr.aria-pressed]="oculta()"
            [appTooltip]="
                oculta() ? 'Próximas rolagens: só o mestre vê' : 'Próximas rolagens: públicas'
            "
            (click)="alternarVisibilidade()"
        >
            <app-icone [nome]="oculta() ? 'olho-fechado' : 'olho'" />
            {{ oculta() ? "Rolagens Ocultas (Privadas)" : "Rolagens Públicas" }}
        </button>

        <app-guia-formula class="rolagem-avulso__guia" [compacto]="false" />

        <button
            app-botao
            variante="secundario"
            estilo="preenchido"
            tamanho="pequeno"
            posicaoIcone="esquerda"
            class="rolagem-avulso__rolar"
            type="submit"
            [class.rolagem-avulso__rolar--confirmada]="rolagemConfirmada()"
            [disabled]="!expressao().trim()"
        >
            <app-icone [nome]="rolagemConfirmada() ? 'check' : 'd20'" />
            {{ rolagemConfirmada() ? "Rolado" : "Rolar" }}
        </button>
    </form>

    <p class="rolagem-avulso__ajuda">Dados e operações livres, sem atributos de ficha.</p>
</section>

<app-montador-rolagem
    #montador
    [oculto]="true"
    [formula]="expressao()"
    (formulaChange)="alterarExpressao($event)"
    [formulaValida]="formulaValida()"
    [atributos]="atributosNeutros"
    [corFicha]="combatente().corFicha"
    [ultimaRolagem]="ultimaRolagem()"
    (rolar)="rolar()"
/>
