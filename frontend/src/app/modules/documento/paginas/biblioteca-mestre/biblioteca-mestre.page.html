<!-- Biblioteca do mestre (m9-04): a estrutura comum da Biblioteca (m9-05, `app-biblioteca-layout`)
     com o que é só do mestre — "Novo documento", chips de estado, setas de ordem, as ações do
     documento aberto e a edição no próprio lugar. -->
<app-biblioteca-layout
    [campanhaId]="campanhaId"
    [campanhaNome]="campanhaNome()"
    [voltarRota]="['/campanhas', campanhaId]"
    voltarRotulo="Voltar à campanha"
    [documentos]="documentos()"
    [carregandoLista]="carregandoLista()"
    [abertoId]="abertoId()"
    [documento]="aberto()"
    [mostrarEstado]="true"
    [leitoresPorDocumento]="leitoresPorDocumento()"
    [ordenavel]="true"
    [bloqueado]="bloqueado()"
    vazioTitulo="Nenhum documento ainda."
    vazioApoio="Crie cartas, relatórios e imagens para revelar à mesa na hora certa."
    painelVazioApoio="Escolha um documento na lista para ler, editar ou revelar à mesa."
    (selecionar)="selecionar($event)"
    (abrir)="abrirDocumento($event)"
    (mover)="mover($event.documento, $event.deslocamento)"
    (fecharDocumento)="fecharDocumento()"
>
    <button
        bibliotecaAcao
        app-botao
        variante="primario"
        tamanho="pequeno"
        class="biblioteca__acao"
        type="button"
        [disabled]="emOperacao()"
        (click)="abrirNovoDocumento()"
    >
        <app-icone nome="mais" />
        Novo documento
    </button>

    <!-- Com edição aberta, as ações que mexem na versão saem (o rodapé traz Cancelar/Salvar). -->
    <div bibliotecaAcoesDocumento class="biblioteca__documento-acoes">
        @if (aberto(); as documento) { @if (!editando()) {
        <button
            app-botao
            [variante]="documento.revelado ? 'secundario' : 'primario'"
            tamanho="pequeno"
            class="biblioteca__acao"
            type="button"
            [disabled]="bloqueado() || (!documento.revelado && !podeRevelar())"
            (click)="alternarRevelacao()"
        >
            <app-icone [nome]="documento.revelado ? 'olho-fechado' : 'olho'" />
            {{ documento.revelado ? 'Ocultar' : 'Revelar' }}
        </button>
        <button
            app-botao
            variante="secundario"
            tamanho="pequeno"
            class="biblioteca__acao"
            type="button"
            [disabled]="bloqueado()"
            (click)="iniciarEdicao()"
        >
            <app-icone nome="editar" />
            Editar
        </button>
        <button
            app-botao
            variante="perigo"
            tamanho="pequeno"
            class="biblioteca__acao"
            type="button"
            [disabled]="bloqueado()"
            (click)="remover()"
        >
            <app-icone nome="excluir" />
            Remover
        </button>
        } }
    </div>

    <div bibliotecaCorpoDocumento class="biblioteca__documento-corpo">
        @if (aberto(); as documento) { @if (!editando() && !documento.revelado && !podeRevelar()) {
        <p class="biblioteca__nota">Envie a imagem para poder revelar este documento.</p>
        } @if (editando()) {
        <app-documento-edicao
            [documento]="documento"
            (salvo)="aoSalvarDocumento($event)"
            (imagemEnviada)="aoEnviarImagem($event)"
            (versaoRecarregada)="aoRecarregarVersao($event)"
            (encerrada)="sairDaEdicao()"
        />
        } @else {
        <app-leitor-documento class="biblioteca__leitor" [documento]="documento" />
        } }
    </div>
</app-biblioteca-layout>

@if (criando()) {
<app-documento-criar-dialog
    [campanhaId]="campanhaId"
    (criado)="aoCriarDocumento($event)"
    (fechou)="fecharNovoDocumento()"
/>
}
