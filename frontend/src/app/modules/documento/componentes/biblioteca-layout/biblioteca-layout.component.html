<!-- Estrutura comum da Biblioteca (m9-05): casca do hub de cenas + o corpo (m9-11,
     `app-biblioteca-corpo`) — lista (com a busca no topo) | documento aberto. -->
<div class="biblioteca">
    <div class="biblioteca__conteudo">
        <header class="biblioteca__cabecalho">
            <a
                app-botao-icone
                tamanho="padrao"
                [routerLink]="voltarRota()"
                [attr.aria-label]="voltarRotulo()"
                [appTooltip]="voltarRotulo()"
            >
                <app-icone nome="voltar" />
            </a>
            <span class="biblioteca__indice">//</span>
            <h1 class="biblioteca__titulo">Biblioteca</h1>
            @if (campanhaNome()) {
                <span class="biblioteca__campanha">{{ campanhaNome() }}</span>
            }
            <span class="biblioteca__regua"></span>
            <ng-content select="[bibliotecaAcao]" />
        </header>

        <app-biblioteca-corpo
            [campanhaId]="campanhaId()"
            [documentos]="documentos()"
            [carregandoLista]="carregandoLista()"
            [abertoId]="abertoId()"
            [documento]="documento()"
            [mostrarEstado]="mostrarEstado()"
            [leitoresPorDocumento]="leitoresPorDocumento()"
            [ordenavel]="ordenavel()"
            [bloqueado]="bloqueado()"
            [vazioTitulo]="vazioTitulo()"
            [vazioApoio]="vazioApoio()"
            [painelVazioApoio]="painelVazioApoio()"
            (selecionar)="selecionar.emit($event)"
            (abrir)="abrir.emit($event)"
            (mover)="mover.emit($event)"
            (fecharDocumento)="fecharDocumento.emit()"
        >
            <!-- Reprojeção dos slots da página no corpo (m9-11). O `ng-container` sempre chega ao
                 corpo, então o leitor padrão (sem projeção da página) é o fallback daqui. -->
            <ng-container ngProjectAs="[bibliotecaAcoesDocumento]">
                <ng-content select="[bibliotecaAcoesDocumento]" />
            </ng-container>
            <ng-container ngProjectAs="[bibliotecaCorpoDocumento]">
                <ng-content select="[bibliotecaCorpoDocumento]">
                    @if (documento(); as aberto) {
                        <app-leitor-documento class="biblioteca__leitor" [documento]="aberto" />
                    }
                </ng-content>
            </ng-container>
        </app-biblioteca-corpo>
    </div>
</div>
