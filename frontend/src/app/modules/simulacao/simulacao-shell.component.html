<section class="simulacao">
    <header class="simulacao__cabecalho">
        <h1 class="simulacao__titulo">Simulação</h1>
        <app-chip>Acesso Livre</app-chip>
    </header>

    <nav class="simulacao__abas" aria-label="Navegação da simulação">
        @for (aba of abas; track aba.caminho) {
            <a
                class="simulacao__aba abas__item"
                [routerLink]="aba.caminho"
                routerLinkActive="simulacao__aba--ativa abas__item--ativo"
            >
                <app-icone [nome]="aba.icone" />
                <span class="simulacao__aba-rotulo">{{ aba.rotulo }}</span>
            </a>
        }
    </nav>

    <router-outlet />
</section>
