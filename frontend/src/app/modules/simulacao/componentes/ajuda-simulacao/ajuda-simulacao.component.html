<button
    app-botao
    [variante]="confirmandoLimpeza() ? 'primario' : 'secundario'"
    type="button"
    class="ajuda-limpar"
    [class.ajuda-limpar--confirmando]="confirmandoLimpeza()"
    [attr.aria-label]="
        confirmandoLimpeza()
            ? 'Confirmar: voltar esta aba ao estado padrão'
            : 'Limpar: voltar esta aba ao estado padrão'
    "
    (click)="aoClicarLimpar()"
>
    <span class="ajuda-limpar__marca" aria-hidden="true">{{
        confirmandoLimpeza() ? "!" : "↺"
    }}</span>
    <span>{{ confirmandoLimpeza() ? "Tem certeza?" : "Limpar" }}</span>
</button>

<button
    app-botao
    variante="secundario"
    type="button"
    class="ajuda-gatilho"
    [attr.aria-label]="'Ajuda: como usar ' + conteudo().titulo"
    (click)="abrir()"
>
    <span class="ajuda-gatilho__marca" aria-hidden="true">?</span>
    <span>Ajuda</span>
</button>

@if (aberto()) {
    <app-modal
        [aberto]="aberto()"
        [titulo]="conteudo().titulo"
        [fechavelPeloFundo]="false"
        (fechou)="fechar()"
    >
        <p class="ajuda__resumo">{{ conteudo().resumo }}</p>

        <ul class="ajuda__lista">
            @for (passo of conteudo().passos; track $index) {
                <li class="ajuda__item">{{ passo }}</li>
            }
        </ul>

        @if (conteudo().nota; as nota) {
            <p class="ajuda__nota">{{ nota }}</p>
        }

        <div class="ajuda__acoes">
            <button
                app-botao
                variante="secundario"
                class="ajuda__fechar"
                type="button"
                (click)="fechar()"
            >
                Fechar
            </button>
        </div>
    </app-modal>
}
