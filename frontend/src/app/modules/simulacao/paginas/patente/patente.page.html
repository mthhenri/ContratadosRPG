<app-ajuda-simulacao aba="patente" (limpar)="limpar()" />

<form class="calc patente" [formGroup]="formulario">
    <!-- CARD 1: CONSULTA -->
    <app-cartao titulo="Consulta por Prestígio">
        <span cartaoIndice>1</span>

        <div class="calc-config">
            <div class="calc-campo">
                <span class="calc-campo__rotulo">Prestígio atual</span>
                <app-step-input
                    formControlName="prestigio"
                    [min]="0"
                    ariaRotulo="Prestígio atual"
                />
            </div>
        </div>

        <div class="patente-destaque">
            <div class="patente-destaque__nome">{{ atual().nome }}</div>
            <div class="patente-destaque__faixa">{{ atual().faixa }} Prestígio</div>
        </div>

        <div class="calc-stats">
            <app-stat rotulo="Salário / Missão" [valor]="atual().salario" variante="positivo" />
            <app-stat rotulo="Limite de Modificações" [valor]="atual().modificacoes" />
            <app-stat rotulo="Limite de Crédito" [valor]="atual().credito">
                <button
                    statInfo
                    type="button"
                    app-botao-icone
                    [redondo]="true"
                    class="patente__stat-info"
                    aria-label="Descrição do Limite de Crédito"
                    [appTooltip]="atual().creditoDescricao"
                >
                    ⓘ
                </button>
            </app-stat>
        </div>
    </app-cartao>

    <!-- CARD 2: REFERÊNCIA COMPLETA -->
    <app-cartao titulo="Referência Completa de Patentes">
        <span cartaoIndice>2</span>

        <div class="calc-tabela-wrap">
            <table class="calc-tabela">
                <thead>
                    <tr>
                        <th class="calc-tabela__celula-rotulo">Patente</th>
                        <th>Prestígio</th>
                        <th>Salário</th>
                        <th>Mods</th>
                        <th>Crédito</th>
                    </tr>
                </thead>
                <tbody>
                    @for (linha of linhas(); track linha.patente) {
                    <tr [class.calc-tabela__linha--atual]="linha.atual">
                        <th class="calc-tabela__celula-rotulo">{{ linha.nome }}</th>
                        <td>{{ linha.faixa }}</td>
                        <td class="calc-tabela__celula-valor">{{ linha.salario }}</td>
                        <td>{{ linha.modificacoes }}</td>
                        <td>{{ linha.credito }}</td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </app-cartao>
</form>
