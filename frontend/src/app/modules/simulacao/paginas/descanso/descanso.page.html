<app-ajuda-simulacao aba="descanso" (limpar)="limpar()" />

<form class="calc descanso" [formGroup]="formulario">
    <!-- CARD 1: CONFIGURAÇÃO -->
    <app-cartao titulo="Configuração do Descanso">
        <span cartaoIndice>1</span>

        <div class="calc-config">
            <div class="calc-campo">
                <label class="calc-campo__rotulo" for="desc-tipo">Tipo de Descanso</label>
                <select id="desc-tipo" class="calc-select" formControlName="tipo">
                    @for (opcao of tipos; track opcao.valor) {
                    <option [value]="opcao.valor">{{ opcao.rotulo }}</option>
                    }
                </select>
            </div>

            <div class="calc-campo">
                <label class="calc-campo__rotulo" for="desc-qualidade">Qualidade do Ambiente</label>
                <select id="desc-qualidade" class="calc-select" formControlName="qualidade">
                    @for (opcao of qualidades; track opcao.valor) {
                    <option [value]="opcao.valor">{{ opcao.rotulo }}</option>
                    }
                </select>
            </div>

            <div class="calc-campo">
                <span class="calc-campo__rotulo"
                    >Vigor <span class="calc-campo__auxiliar">(para Vida)</span></span
                >
                <app-step-input formControlName="vigor" [min]="0" [max]="12" ariaRotulo="Vigor" />
            </div>

            <div class="calc-campo">
                <span class="calc-campo__rotulo"
                    >Destreza <span class="calc-campo__auxiliar">(para Energia)</span></span
                >
                <app-step-input
                    formControlName="destreza"
                    [min]="0"
                    [max]="12"
                    ariaRotulo="Destreza"
                />
            </div>

            <div class="calc-campo">
                <span class="calc-campo__rotulo">Nível</span>
                <app-step-input formControlName="nivel" [min]="0" [max]="20" ariaRotulo="Nível" />
            </div>

            <div class="calc-campo">
                <span class="calc-campo__rotulo">
                    Medicina <span class="calc-campo__auxiliar">(Metabolismo)</span>
                </span>
                <app-step-input
                    formControlName="medicina"
                    [min]="0"
                    [max]="12"
                    ariaRotulo="Medicina"
                />
            </div>

            <div class="calc-campo">
                <span class="calc-campo__rotulo">
                    Vontade <span class="calc-campo__auxiliar">(Metabolismo)</span>
                </span>
                <app-step-input
                    formControlName="vontade"
                    [min]="0"
                    [max]="12"
                    ariaRotulo="Vontade"
                />
            </div>

            <div class="calc-campo">
                <label class="calc-campo__rotulo" for="desc-refeicao">Refeição consumida?</label>
                <select id="desc-refeicao" class="calc-select" formControlName="refeicao">
                    @for (opcao of opcoesSimNao; track opcao.valor) {
                    <option [value]="opcao.valor">{{ opcao.rotulo }}</option>
                    }
                </select>
            </div>

            <div class="calc-campo">
                <label class="calc-campo__rotulo" for="desc-interrupcao">Foi interrompido?</label>
                <select id="desc-interrupcao" class="calc-select" formControlName="interrompido">
                    @for (opcao of opcoesInterrupcao; track opcao.valor) {
                    <option [value]="opcao.valor">{{ opcao.rotulo }}</option>
                    }
                </select>
            </div>

            <div class="descanso-habilidades" role="group" aria-label="Habilidades de descanso">
                <label class="descanso-habilidade" for="desc-segundo-folego">
                    <input
                        id="desc-segundo-folego"
                        type="checkbox"
                        formControlName="segundoFolego"
                    />
                    <span>
                        <b>Segundo Fôlego</b>
                        <small>+Vigor ÷ 2 dados de Energia</small>
                    </span>
                </label>
                <label class="descanso-habilidade" for="desc-metabolismo-acelerado">
                    <input
                        id="desc-metabolismo-acelerado"
                        type="checkbox"
                        formControlName="metabolismoAcelerado"
                    />
                    <span>
                        <b>Metabolismo Acelerado</b>
                        <small>+Medicina D4 de Vida e +Vontade D4 de Energia</small>
                    </span>
                </label>
            </div>
        </div>
    </app-cartao>

    <!-- CARD 2: RESULTADO DETERMINÍSTICO -->
    <app-cartao titulo="Resultado">
        <span cartaoIndice>2</span>

        <div class="calc-stats descanso-faixas">
            <app-stat
                rotulo="Recuperação de Vida"
                [valor]="vidaFaixa()"
                [nota]="vidaFormula()"
                variante="vida"
            />
            <app-stat
                rotulo="Recuperação de Energia"
                [valor]="energiaFaixa()"
                [nota]="energiaFormula()"
                variante="energia"
            />
        </div>

        <div class="calc-lista">
            @for (nota of notas(); track $index) {
            <div class="calc-lista__item">
                <span class="calc-lista__marcador">›</span>
                <span>{{ nota }}</span>
            </div>
            }
        </div>
    </app-cartao>

    <!-- CARD 3: ROLAR DADOS -->
    <app-cartao titulo="Rolar Dados">
        <span cartaoIndice>3</span>

        <div class="calc-config">
            <div class="calc-campo">
                <label class="calc-campo__rotulo" for="desc-extra-vida">
                    Dados Extras de Vida <span class="calc-campo__auxiliar">(ex.: 2d6, 1d8)</span>
                </label>
                <input
                    id="desc-extra-vida"
                    class="calc-texto"
                    type="text"
                    placeholder="0"
                    formControlName="extraVida"
                />
            </div>

            <div class="calc-campo">
                <label class="calc-campo__rotulo" for="desc-extra-energia">
                    Dados Extras de Energia
                    <span class="calc-campo__auxiliar">(ex.: 2d6, 1d8)</span>
                </label>
                <input
                    id="desc-extra-energia"
                    class="calc-texto"
                    type="text"
                    placeholder="0"
                    formControlName="extraEnergia"
                />
            </div>
        </div>

        <button
            app-botao
            variante="primario"
            type="button"
            class="descanso-rolar"
            [class.descanso-rolar--rolando]="rolando()"
            [disabled]="rolando()"
            (click)="rolar()"
        >
            {{ rolando() ? 'Rolando…' : 'Rolar' }}
        </button>

        @if (rolagemVisivel()) {
        <div class="calc-stats descanso-rolagem">
            <app-stat
                tamanho="hero"
                rotulo="Vida Recuperada"
                [valor]="vidaRolada()"
                [nota]="vidaBreakdown()"
                [pulso]="pulsoVida()"
                variante="vida"
            />
            <app-stat
                tamanho="hero"
                rotulo="Energia Recuperada"
                [valor]="energiaRolada()"
                [nota]="energiaBreakdown()"
                [pulso]="pulsoEnergia()"
                variante="energia"
            />
        </div>
        }
    </app-cartao>
</form>
