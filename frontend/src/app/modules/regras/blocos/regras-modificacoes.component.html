@if (bloco().nota; as nota) {
    <app-regras-nota
        [bloco]="{ tipo: 'nota', trechos: nota }"
        [documento]="documento()"
        (navegarAncora)="navegarAncora.emit($event)"
    />
}
<div class="regras-modificacoes">
    @for (item of bloco().itens; track $index) {
        <article class="regras-modificacoes__item">
            <h4 class="regras-modificacoes__nome">{{ item.nome }}</h4>
            <span
                class="regras-modificacoes__empilhamento"
                [attr.aria-label]="'Empilhamento: ' + item.empilhamento"
            >
                @for (marca of item.empilhamento; track $index) {
                    <span
                        [class.regras-modificacoes__marca--cheia]="marca === '■'"
                        aria-hidden="true"
                        >{{ marca }}</span
                    >
                }
            </span>
            <p class="regras-modificacoes__efeito">
                <app-regras-inline
                    [trechos]="item.efeito"
                    [documento]="documento()"
                    (navegarAncora)="navegarAncora.emit($event)"
                />
            </p>
            <p class="regras-modificacoes__bloqueia">
                <strong>Bloqueia:</strong>&ngsp;
                <app-regras-inline
                    [trechos]="item.bloqueia"
                    [documento]="documento()"
                    (navegarAncora)="navegarAncora.emit($event)"
                />
            </p>
        </article>
    }
</div>
