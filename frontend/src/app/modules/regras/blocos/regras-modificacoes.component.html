@if (bloco().nota; as nota) {
    <app-regras-nota
        [bloco]="{ tipo: 'nota', trechos: nota }"
        [documento]="documento()"
        (navegarAncora)="navegarAncora.emit($event)"
    />
}
@if (resumo(); as texto) {
    <p class="regras-modificacoes__resumo">{{ texto }}</p>
}
<div class="regras-modificacoes">
    @for (linha of itens(); track $index) {
        <article class="regras-modificacoes__item">
            <h4 class="regras-modificacoes__nome">{{ linha.item.nome }}</h4>
            <app-empilhamento
                [iniciais]="linha.iniciais"
                [maximo]="linha.maximo"
                [rotulo]="linha.item.nome"
            />
            @if (linha.peso !== undefined) {
                <p class="regras-modificacoes__peso">{{ formatarPeso(linha.peso) }}</p>
            }
            <p class="regras-modificacoes__efeito">
                <app-regras-inline
                    [trechos]="linha.item.efeito"
                    [documento]="documento()"
                    (navegarAncora)="navegarAncora.emit($event)"
                />
            </p>
            <p class="regras-modificacoes__bloqueia">
                <strong>Bloqueia:</strong>&ngsp;
                <app-regras-inline
                    [trechos]="linha.item.bloqueia"
                    [documento]="documento()"
                    (navegarAncora)="navegarAncora.emit($event)"
                />
            </p>
        </article>
    }
</div>
