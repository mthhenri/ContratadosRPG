<div class="regras-habilidade">
    <div class="regras-habilidade__nome">
        <span aria-hidden="true">{{ bloco().glifo }}</span> {{ bloco().nome }}
    </div>
    <div class="regras-habilidade__selos">
        @if (bloco().reacao) {
            <app-chip severidade="ajuda" tom="contorno">REAÇÃO</app-chip>
        }
        <app-chip
            severidade="energia"
            tom="sutil"
            [appTooltip]="bloco().custo + ' de Energia'"
            tabindex="0"
            [attr.aria-label]="bloco().custo + ' de Energia'"
        >
            <app-icone nome="energia" /> {{ bloco().custo }}
        </app-chip>
    </div>
    <p>
        <app-regras-inline
            [trechos]="bloco().trechos"
            [documento]="documento()"
            (navegarAncora)="navegarAncora.emit($event)"
        />
    </p>
</div>
