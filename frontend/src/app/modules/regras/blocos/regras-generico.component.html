<div class="regras-generico">
    @if (editando()) {
        <p class="regras-generico__nota">Nota da importação: {{ bloco().motivo }}</p>
    }
    @if (bloco().trechos.length || editando()) {
        <p>
            <app-regras-inline
                [trechos]="bloco().trechos"
                [peca]="bloco().peca"
                rotuloEdicao="Texto"
                [documento]="documento()"
                (navegarAncora)="navegarAncora.emit($event)"
            />
        </p>
    } @else if (!bloco().filhos?.length) {
        <p>{{ bloco().origemMarkdown }}</p>
    }
    @if (bloco().filhos; as filhos) {
        <app-regras-conteudo
            [filhos]="filhos"
            [documento]="documento()"
            (navegarAncora)="navegarAncora.emit($event)"
        />
    }
</div>
