<app-cartao
    [titulo]="bloco().nome"
    [cabecalhoQuebravel]="true"
    [attr.id]="identificador()"
    [attr.data-ancora-regras]="bloco().ancora"
>
    @if (icone(); as nomeIcone) {
        <app-icone cartaoIndice [nome]="nomeIcone" />
    }
    <div class="regras-classe">
        <p class="regras-classe__citacao">
            <app-regras-inline
                [trechos]="bloco().citacao"
                [peca]="bloco().peca"
                campo="citacao"
                rotuloEdicao="Citação"
                [documento]="documento()"
                (navegarAncora)="navegarAncora.emit($event)"
            />
        </p>
        <app-regras-saude
            [saude]="bloco().saude"
            [progressao]="bloco().progressao"
            [documento]="documento()"
            (navegarAncora)="navegarAncora.emit($event)"
        />
        <h3 class="regras-classe__rotulo">Habilidades de classe</h3>
        <app-regras-conteudo
            [filhos]="bloco().habilidades"
            [pai]="bloco().peca ?? undefined"
            [documento]="documento()"
            (navegarAncora)="navegarAncora.emit($event)"
        />
        @for (arquetiposClasse of arquetipos(); track $index) {
            <app-regras-arquetipos
                [bloco]="arquetiposClasse"
                [iniciais]="bloco().arquetipos"
                [documento]="documento()"
                (navegarAncora)="navegarAncora.emit($event)"
            />
        }
        @if (bloco().peca; as pecaClasse) {
            <app-oficina-insercao
                [pai]="pecaClasse"
                [restritoA]="tiposArquetipo"
                [fim]="true"
                rotulo="Arquétipo"
            />
        }
    </div>
</app-cartao>
