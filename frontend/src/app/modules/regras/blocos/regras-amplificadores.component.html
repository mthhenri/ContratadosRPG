<div class="regras-modificacoes">
    @for (linha of itens(); track linha.item.peca ?? $index) {
        <app-oficina-peca [peca]="linha.item.peca">
            <article class="regras-modificacoes__item">
                <h4 class="regras-modificacoes__nome">
                    @if (editando() && linha.item.peca) {
                        <app-oficina-texto
                            campo="nome"
                            rotulo="Nome do amplificador"
                            vazio="Nome do amplificador"
                            [peca]="linha.item.peca"
                            [texto]="linha.item.nome"
                        />
                    } @else {{{ linha.item.nome }}}
                </h4>
                @if (selecionado(linha.item.peca)) {
                    <app-oficina-empilhamento
                        [peca]="linha.item.peca!"
                        [valor]="linha.item.empilhamento"
                        [rotulo]="linha.item.nome"
                    />
                } @else {
                    <app-empilhamento
                        [iniciais]="linha.iniciais"
                        [maximo]="linha.maximo"
                        [rotulo]="linha.item.nome"
                    />
                }
                <p class="regras-modificacoes__efeito">
                    <app-regras-inline
                        [trechos]="linha.item.efeito"
                        [peca]="linha.item.peca"
                        campo="efeito"
                        rotuloEdicao="Efeito"
                        dica="Efeito"
                        [documento]="documento()"
                        (navegarAncora)="navegarAncora.emit($event)"
                    />
                </p>
            </article>
        </app-oficina-peca>
    }
</div>
@if (bloco().peca; as pecaContainer) {
    <app-oficina-insercao [pai]="pecaContainer" [restritoA]="tiposItem" [fim]="true" rotulo="Amplificador" />
}
