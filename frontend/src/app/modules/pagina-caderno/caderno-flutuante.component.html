@if (mostrarGatilho() && (!aberto() || painelRef()?.minimizado())) {
    <button
        #gatilho
        class="caderno__gatilho utilitario-flutuante utilitario-flutuante--caderno utilitario-flutuante--inline-mobile"
        [class.caderno__gatilho--sem-inventario]="semVagaInventario()"
        type="button"
        [attr.aria-label]="aberto() ? 'Reabrir caderno' : 'Abrir caderno'"
        aria-expanded="false"
        (click)="aberto() ? painelRef()?.restaurar() : abrir()"
    >
        <app-icone nome="caderno" />
    </button>
}

<app-painel-flutuante
    #painel="appPainelFlutuante"
    id="caderno"
    [titulo]="'Caderno · ' + campanhaNome()"
    kicker="Registro operacional"
    [aberto]="aberto()"
    [mobile]="ehMobile()"
    [maximizada]="maximizada()"
    [largura]="ehMobile() ? null : estado().tamanho.largura"
    [altura]="ehMobile() ? null : estado().tamanho.altura"
    [posicaoInicial]="posicaoInicial()"
    [pisoX]="pisoX()"
    [ignorarMinimizadoPersistido]="!mostrarGatilho()"
    (fechar)="fechar()"
    (minimizadoChange)="aoMinimizadoChange($event)"
>
    <app-caderno-salvamento painelCabecalhoExtra />
    @if (!ehMobile()) {
        <ng-container painelAcoesExtras>
            <button
                app-botao-icone
                type="button"
                aria-label="Abrir caderno em janela"
                appTooltip="Abrir em janela"
                (pointerdown)="$event.stopPropagation()"
                (click)="abrirEmJanela()"
            >
                <app-icone nome="abrir-externo" />
            </button>
            <button
                app-botao-icone
                type="button"
                [attr.aria-label]="
                    maximizada() ? 'Restaurar tamanho do caderno' : 'Maximizar caderno'
                "
                [appTooltip]="maximizada() ? 'Restaurar tamanho' : 'Maximizar'"
                (pointerdown)="$event.stopPropagation()"
                (click)="alternarMaximizacao()"
            >
                <span aria-hidden="true">{{ maximizada() ? "❐" : "□" }}</span>
            </button>
        </ng-container>
    }

    <app-caderno-conteudo
        [campanhaId]="campanhaId()"
        [ehMestre]="ehMestre()"
        [membros]="membros()"
        [mobile]="ehMobile()"
        [recolhido]="recolhido()"
        (abrirFicha)="abrirFicha.emit($event)"
    />

    @if (!ehMobile() && !maximizada()) {
        <span
            painelRedimensionar
            class="caderno__redimensionar"
            aria-hidden="true"
            (pointerdown)="iniciarRedimensionamento($event)"
        ></span>
    }
</app-painel-flutuante>
