name: CI

# Integração contínua: organização do repositório + lint + testes em todo Pull Request.
# Adoção: troque os passos de Node pelos da stack real; o passo "Organização" é genérico e
# só exige Node 22+ (o script usa apenas a biblioteca padrão).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Organização, lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Espelhos CLAUDE.md = AGENTS.md, .claude/skills = .agents/skills e destinos de spec/artefato.
      - name: Organização do repositório e espelhos de agentes
        run: |
          node --test scripts/verificar-organizacao.test.mjs
          node scripts/verificar-organizacao.mjs --staged

      # <adoção> instalar dependências, lint e testes da stack real:
      # - run: npm ci
      # - run: npm run lint
      # - run: npm run test
