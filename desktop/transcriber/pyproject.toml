[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "contratados-transcriber"
version = "0.3.0"
description = "Aplicativo Windows auxiliar do Contratados RPG"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.8.3"]

[project.scripts]
contratados-transcriber = "contratados_transcriber.app:main"

[tool.setuptools.packages.find]
where = ["src"]
